name: Publish Docker image

# Builds the image once here and pushes it to GHCR, so a deploy is just
# `docker compose pull && up -d` — no build (and no disk/CPU load) on the
# host actually running the app. See the wiki's deploy guides.
on:
  push:
    branches: ["master"]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercases owner/repo automatically (GHCR requires lowercase image
      # names; the GitHub username here, scotCW, isn't) and tags:
      # - branch name for a push to master ("master")
      # - "latest" only on master (not on tag builds)
      # - the git tag itself for a "v*" push (e.g. "v1.2.0")
      # - the commit SHA, always, so any build can be pinned/traced back
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
