version: 2
updates:
  # Dependabot understands npm workspaces from the root lockfile — one
  # entry here covers apps/server, apps/web, and packages/shared too, no
  # need for a separate entry per workspace.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # packages/shared and apps/server must move to a new zod major
      # together (two installed copies break `instanceof ZodError` — see
      # AGENTS.md), and Dependabot bumps them one manifest at a time.
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
      # Prisma 7 needs prisma.config.ts and a driver adapter (see AGENTS.md),
      # so major bumps need a real migration. Minor and patch updates still
      # come through.
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docker"
