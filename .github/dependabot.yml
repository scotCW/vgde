version: 2
updates:
  # Dependabot understands npm workspaces from the root lockfile — one
  # entry here covers apps/server, apps/web, and packages/shared too, no
  # need for a separate entry per workspace.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Pinned to exactly 3.23.8, deliberately: 3.25.x+ ships zod 4's
      # internals under a v3-compat shim with a different top-level export
      # shape, which caused two separate zod module instances to load in
      # this repo and broke `instanceof ZodError` checks (see app.ts and
      # routes.ts's parseBody). A major-version bump here needs an actual
      # migration pass, not an automated PR.
      - dependency-name: "zod"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docker"
